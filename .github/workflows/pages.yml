name: Publicar página

# A página é estática: site/data/resultados.json sai de `python -m consultor
# site`, rodado localmente depois do `provar` (o Postgres com a base do
# Instacart vive no computador do autor). Este workflow só publica site/.
on:
  push:
    branches: [master]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
